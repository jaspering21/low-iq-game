<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>低智商小游戏十连抽</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: #0f3460;
            --accent-pink: #ff6b9d;
            --accent-yellow: #ffd93d;
            --accent-cyan: #6bcb77;
            --accent-orange: #ff9f43;
            --text-primary: #ffffff;
            --text-secondary: #b8b8d1;
            --common: #a0a0a0;
            --rare: #4fc3f7;
            --epic: #ba68c8;
            --legendary: #ffd700;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* 背景装饰 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 80%, rgba(255, 107, 157, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(107, 203, 119, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 217, 61, 0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* 标题区 */
        header {
            text-align: center;
            padding: 30px 0 20px;
        }

        h1 {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 3rem;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-yellow), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(255, 107, 157, 0.5);
            animation: titleFloat 3s ease-in-out infinite;
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .subtitle {
            color: var(--text-secondary);
            margin-top: 10px;
            font-size: 1.1rem;
        }

        /* 分数区 */
        .score-panel {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .score-item {
            background: var(--bg-secondary);
            padding: 15px 30px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .score-item.gold { border-color: var(--accent-yellow); }
        .score-item.streak { border-color: var(--accent-pink); }

        .score-icon {
            font-size: 1.5rem;
        }

        .score-value {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 1.8rem;
            color: var(--accent-yellow);
        }

        .score-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* 抽卡区 */
        .draw-area {
            background: var(--bg-secondary);
            border-radius: 24px;
            padding: 30px;
            margin: 30px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        @media (max-width: 600px) {
            .cards-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* 单张卡牌 */
        .card {
            aspect-ratio: 3/4;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'ZCOOL KuaiLe', cursive;
        }

        .card-front {
            background: linear-gradient(145deg, #2a2a4a, #1a1a3a);
            border: 3px solid var(--common);
            flex-direction: column;
            gap: 10px;
        }

        .card-icon {
            font-size: 3rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }

        .card-back {
            background: linear-gradient(145deg, #2a2a4a, #1a1a3a);
            transform: rotateY(180deg);
            padding: 10px;
            flex-direction: column;
            overflow: hidden;
        }

        .card-icon-back {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        /* 稀有度边框 */
        .card.common .card-front,
        .card.common .card-back { border-color: var(--common); }
        .card.rare .card-front,
        .card.rare .card-back { border-color: var(--rare); box-shadow: 0 0 20px rgba(79, 195, 247, 0.4); }
        .card.epic .card-front,
        .card.epic .card-back { border-color: var(--epic); box-shadow: 0 0 25px rgba(186, 104, 200, 0.5); }
        .card.legendary .card-front,
        .card.legendary .card-back { border-color: var(--legendary); box-shadow: 0 0 30px rgba(255, 215, 0, 0.6); animation: legendaryGlow 1.5s ease-in-out infinite; }

        @keyframes legendaryGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.6); }
            50% { box-shadow: 0 0 50px rgba(255, 215, 0, 0.9); }
        }

        .card-question {
            font-size: 0.7rem;
            text-align: center;
            color: var(--accent-yellow);
            line-height: 1.3;
            margin-bottom: 5px;
        }

        .card-answer {
            font-size: 0.6rem;
            color: var(--text-secondary);
            text-align: center;
            padding: 4px;
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            width: 100%;
        }

        .card.legendary .card-question { color: var(--legendary); font-size: 0.8rem; }
        .card.epic .card-question { color: var(--epic); }

        .rarity-badge {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 0.5rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(0,0,0,0.5);
        }

        .card.common .rarity-badge { color: var(--common); }
        .card.rare .rarity-badge { color: var(--rare); }
        .card.epic .rarity-badge { color: var(--epic); }
        .card.legendary .rarity-badge { color: var(--legendary); }

        /* 抽卡按钮 */
        .draw-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            padding: 20px 40px;
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 1.8rem;
            color: white;
            background: linear-gradient(135deg, var(--accent-pink), #ff8a65);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.4);
            position: relative;
            overflow: hidden;
        }

        .draw-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            transition: all 0.5s;
        }

        .draw-btn:hover::before {
            left: 100%;
        }

        .draw-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 40px rgba(255, 107, 157, 0.5);
        }

        .draw-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .draw-btn:disabled {
            background: #555;
            box-shadow: none;
            cursor: not-allowed;
        }

        .draw-btn:disabled:hover {
            transform: none;
        }

        /* 答题弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: linear-gradient(145deg, var(--bg-secondary), var(--bg-primary));
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            transform: scale(0.8) translateY(20px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid var(--accent-pink);
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        .modal-rarity {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 1rem;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .modal-rarity.common { background: var(--common); color: #000; }
        .modal-rarity.rare { background: var(--rare); color: #000; }
        .modal-rarity.epic { background: var(--epic); color: #fff; }
        .modal-rarity.legendary { background: linear-gradient(90deg, #ffd700, #ffaa00); color: #000; }

        .modal-question {
            font-size: 1.4rem;
            color: var(--accent-yellow);
            margin: 20px 0;
            font-family: 'ZCOOL KuaiLe', cursive;
            line-height: 1.5;
        }

        .modal-choices {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .choice-btn {
            flex: 1;
            min-width: 120px;
            padding: 15px 20px;
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 1.1rem;
            border: 2px solid var(--accent-cyan);
            background: transparent;
            color: var(--text-primary);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .choice-btn:hover {
            background: var(--accent-cyan);
            color: #000;
            transform: translateY(-2px);
        }

        .choice-btn.correct {
            background: var(--accent-cyan);
            color: #000;
            animation: correctPop 0.5s;
        }

        .choice-btn.wrong {
            background: #ff4757;
            border-color: #ff4757;
            animation: shake 0.5s;
        }

        @keyframes correctPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* 结果显示 */
        .result-answer {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 217, 61, 0.1);
            border-radius: 12px;
            border: 1px solid var(--accent-yellow);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s;
        }

        .result-answer.show {
            opacity: 1;
            transform: translateY(0);
        }

        .result-answer h3 {
            color: var(--accent-yellow);
            font-family: 'ZCOOL KuaiLe', cursive;
            margin-bottom: 10px;
        }

        .result-answer p {
            font-size: 1.2rem;
            color: var(--text-primary);
        }

        .continue-btn {
            margin-top: 20px;
            padding: 12px 30px;
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 1.1rem;
            background: var(--accent-pink);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .continue-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255, 107, 157, 0.4);
        }

        /* 特效 */
        .confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2000;
            overflow: hidden;
        }

        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--accent-yellow);
            animation: confettiFall 3s ease-out forwards;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* 统计区 */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        @media (max-width: 500px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .stat-item {
            background: var(--bg-card);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 1.5rem;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .stat-item:nth-child(1) .stat-value { color: var(--common); }
        .stat-item:nth-child(2) .stat-value { color: var(--rare); }
        .stat-item:nth-child(3) .stat-value { color: var(--epic); }
        .stat-item:nth-child(4) .stat-value { color: var(--legendary); }

        /* 称号区域 */
        .titles-section {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .title-badge {
            background: var(--bg-secondary);
            padding: 12px 25px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 2px solid transparent;
            opacity: 0.4;
            filter: grayscale(100%);
            transition: all 0.5s;
        }

        .title-badge.unlocked {
            opacity: 1;
            filter: grayscale(0%);
        }

        .title-badge.coffee {
            border-color: #8B4513;
        }
        .title-badge.coffee.unlocked {
            background: linear-gradient(135deg, #8B4513, #D2691E);
            box-shadow: 0 0 20px rgba(139, 69, 19, 0.5);
        }

        .title-badge.food {
            border-color: var(--accent-orange);
        }
        .title-badge.food.unlocked {
            background: linear-gradient(135deg, var(--accent-orange), #ff6b6b);
            box-shadow: 0 0 20px rgba(255, 159, 67, 0.5);
        }

        .title-icon {
            font-size: 1.5rem;
        }

        .title-info {
            text-align: left;
        }

        .title-name {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .title-progress {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .title-badge.unlocked .title-progress {
            color: #fff;
        }

        /* 成就解锁动画 */
        @keyframes titleUnlock {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            50% { transform: scale(1.3) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .title-badge.just-unlocked {
            animation: titleUnlock 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* 成就弹窗 */
        .achievement-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(145deg, var(--bg-secondary), var(--bg-primary));
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            z-index: 3000;
            border: 3px solid;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .achievement-modal.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .achievement-modal.coffee { border-color: #D2691E; }
        .achievement-modal.food { border-color: var(--accent-orange); }

        .achievement-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .achievement-title {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .achievement-desc {
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .achievement-close {
            padding: 10px 30px;
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .achievement-modal.coffee .achievement-close { background: #D2691E; color: white; }
        .achievement-modal.food .achievement-close { background: var(--accent-orange); color: white; }

        .achievement-close:hover {
            transform: scale(1.05);
        }

        .achievement-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .achievement-backdrop.show {
            opacity: 1;
            visibility: visible;
        }

        /* 抽卡动画遮罩 */
        .draw-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .draw-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .draw-text {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 3rem;
            color: var(--accent-yellow);
            animation: drawPulse 0.5s ease-in-out infinite;
        }

        @keyframes drawPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>低智商小游戏十连抽</h1>
            <p class="subtitle">测测你的脑洞有多大！</p>
        </header>

        <div class="score-panel">
            <div class="score-item gold">
                <span class="score-icon">🪙</span>
                <div>
                    <div class="score-value" id="goldCount">0</div>
                    <div class="score-label">金币</div>
                </div>
            </div>
            <div class="score-item streak">
                <span class="score-icon">🔥</span>
                <div>
                    <div class="score-value" id="streakCount">0</div>
                    <div class="score-label">连胜</div>
                </div>
            </div>
        </div>

        <div class="titles-section">
            <div class="title-badge coffee" id="coffeeBadge">
                <span class="title-icon">☕</span>
                <div class="title-info">
                    <div class="title-name">咖啡大师</div>
                    <div class="title-progress" id="coffeeProgress">0/5 杯咖啡</div>
                </div>
            </div>
            <div class="title-badge food" id="foodBadge">
                <span class="title-icon">🍜</span>
                <div class="title-info">
                    <div class="title-name">干饭人</div>
                    <div class="title-progress" id="foodProgress">0/5 顿饭</div>
                </div>
            </div>
        </div>

        <div class="draw-area">
            <div class="cards-grid" id="cardsGrid">
                <!-- 卡片将由JS生成 -->
            </div>
            <button class="draw-btn" id="drawBtn">🎰 开始十连抽</button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="statCommon">0</div>
                <div class="stat-label">普通</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statRare">0</div>
                <div class="stat-label">稀有</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statEpic">0</div>
                <div class="stat-label">史诗</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statLegendary">0</div>
                <div class="stat-label">传说</div>
            </div>
        </div>
    </div>

    <!-- 抽卡动画遮罩 -->
    <div class="draw-overlay" id="drawOverlay">
        <div class="draw-text">🎲 抽卡中...</div>
    </div>

    <!-- 答题弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-rarity" id="modalRarity">普通</div>
            <div class="modal-question" id="modalQuestion">问题内容</div>
            <div class="modal-choices" id="modalChoices">
                <button class="choice-btn">A. 选项一</button>
                <button class="choice-btn">B. 选项二</button>
            </div>
            <div class="result-answer" id="resultAnswer">
                <h3>💡 答案揭晓</h3>
                <p id="resultText">这里是答案</p>
            </div>
            <button class="continue-btn" id="continueBtn" style="display:none;">下一题 →</button>
        </div>
    </div>

    <!-- 彩屑特效容器 -->
    <div class="confetti" id="confetti"></div>

    <!-- 成就弹窗 -->
    <div class="achievement-backdrop" id="achievementBackdrop"></div>
    <div class="achievement-modal" id="achievementModal">
        <div class="achievement-icon" id="achievementIcon">🏆</div>

        function getRandomRarity() {
            const totalWeight = rarities.reduce((sum, r) => sum + r.weight, 0);
            let random = Math.random() * totalWeight;
            for (const r of rarities) {
                random -= r.weight;
                if (random <= 0) return r;
            }
            return rarities[0];
        }

            });

            modalOverlay.classList.add('active');
        }

        // 处理答案
        function handleAnswer(e) {
            const isCorrect = e.target.dataset.answer === 'true';
            const buttons = modalChoices.querySelectorAll('.choice-btn');

            buttons.forEach(btn => {
                btn.style.pointerEvents = 'none';
                if (btn.dataset.answer === 'true') {
                    btn.classList.add('correct');
                } else if (e.target === btn && !isCorrect) {
                    btn.classList.add('wrong');
                }
            });

            if (isCorrect) {
                gold += getGoldReward(currentCards[currentIndex].rarity.name);
                streak++;
                document.getElementById('goldCount').textContent = gold;
                document.getElementById('streakCount').textContent = streak;
                showConfetti();

                // 检查称号进度
                const category = currentCards[currentIndex].question.category;
                if (category === 'coffee') {
                    coffeeCorrect++;
                    updateTitleProgress('coffee');
                    checkTitleUnlock('coffee');
                } else if (category === 'food') {
                    foodCorrect++;
                    updateTitleProgress('food');
                    checkTitleUnlock('food');
                }
            } else {
                streak = 0;
                document.getElementById('streakCount').textContent = streak;
            }

            resultText.textContent = currentCards[currentIndex].question.a;
            resultAnswer.classList.add('show');
            continueBtn.style.display = 'inline-block';
        }

        // 更新称号进度显示
        function updateTitleProgress(type) {
            if (type === 'coffee') {
                document.getElementById('coffeeProgress').textContent = `${coffeeCorrect}/${TITLE_REQUIRED} 杯咖啡`;
            } else if (type === 'food') {
                document.getElementById('foodProgress').textContent = `${foodCorrect}/${TITLE_REQUIRED} 顿饭`;
            }
        }

        // 检查称号是否解锁
        function checkTitleUnlock(type) {
            if (type === 'coffee' && coffeeCorrect >= TITLE_REQUIRED && !titles.coffee) {
                titles.coffee = true;
                showAchievementModal('coffee');
            } else if (type === 'food' && foodCorrect >= TITLE_REQUIRED && !titles.food) {
                titles.food = true;
                showAchievementModal('food');
            }
            saveGameData();
        }

        // 显示成就弹窗
        function showAchievementModal(type) {
            const modal = document.getElementById('achievementModal');
            const backdrop = document.getElementById('achievementBackdrop');
            const icon = document.getElementById('achievementIcon');
            const title = document.getElementById('achievementTitle');
            const desc = document.getElementById('achievementDesc');

            modal.className = `achievement-modal ${type} show`;
            backdrop.classList.add('show');

            if (type === 'coffee') {
                icon.textContent = '☕';
                title.textContent = '咖啡大师';
                desc.textContent = '你答对了5杯咖啡的问题，成为真正的咖啡大师！';
                document.getElementById('coffeeBadge').classList.add('unlocked', 'just-unlocked');
                setTimeout(() => {
                    document.getElementById('coffeeBadge').classList.remove('just-unlocked');
                }, 800);
            } else if (type === 'food') {
                icon.textContent = '🍜';
                title.textContent = '干饭人';
                desc.textContent = '你答对了5顿饭的问题，成为无敌干饭人！';
                document.getElementById('foodBadge').classList.add('unlocked', 'just-unlocked');
                setTimeout(() => {
                    document.getElementById('foodBadge').classList.remove('just-unlocked');
                }, 800);
            }

            showConfetti();
            setTimeout(showConfetti, 200);
        }

        // 关闭成就弹窗
        document.getElementById('achievementClose').addEventListener('click', () => {
            document.getElementById('achievementModal').classList.remove('show');
            document.getElementById('achievementBackdrop').classList.remove('show');
        });

        // 获取金币奖励
        function getGoldReward(rarity) {
            const rewards = { common: 10, rare: 25, epic: 50, legendary: 100 };
            return rewards[rarity] || 10;
        }

        // 显示彩屑
        function showConfetti() {
            const colors = ['#ff6b9d', '#ffd93d', '#6bcb77', '#4fc3f7', '#ba68c8'];
            for (let i = 0; i < 50; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + '%';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDelay = Math.random() * 0.5 + 's';
                piece.style.animationDuration = (2 + Math.random()) + 's';
                confettiContainer.appendChild(piece);
                setTimeout(() => piece.remove(), 3500);
            }
        }

        // 继续下一题
        continueBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
            currentIndex++;
            if (currentIndex < currentCards.length) {
                setTimeout(() => showQuizModal(currentIndex), 300);
            }
        });

        // 开始抽卡
        drawBtn.addEventListener('click', async () => {
            if (isDrawing) return;
            isDrawing = true;
            drawBtn.disabled = true;
            drawOverlay.classList.add('active');

            // 清空之前的卡
            cardsGrid.innerHTML = '';
            currentCards = [];

            // 生成10张卡
            for (let i = 0; i < 10; i++) {
                const rarity = getRandomRarity();
                const question = getRandomQuestion();
                currentCards.push({ rarity, question });
                stats[rarity.name]++;
                document.getElementById(`stat${rarity.name.charAt(0).toUpperCase() + rarity.name.slice(1)}`).textContent = stats[rarity.name];
            }

            // 显示抽卡动画
            await new Promise(resolve => setTimeout(resolve, 1500));
            drawOverlay.classList.remove('active');

            // 创建卡片（先全部创建但不翻转）
            currentCards.forEach((cardData, index) => {
                const card = createCard(cardData.rarity, cardData.question);
                const cardInner = card.querySelector('.card-inner');
                const cardBack = card.querySelector('.card-back');
                cardBack.querySelector('.card-question').textContent = cardData.question.q;

                // 依次翻转动画
                setTimeout(() => {
                    card.classList.add('flipped');
                }, index * 150);

                card.addEventListener('click', () => {
                    showQuizModal(index);
                });

                cardsGrid.appendChild(card);
            });

            // 等待所有卡片翻转完成后可以再次抽卡
            setTimeout(() => {
                isDrawing = false;
                drawBtn.disabled = false;
                drawBtn.textContent = '🔄 再来十连抽';
            }, 1500 + 10 * 150 + 500);

            // 保存数据到localStorage
            saveGameData();
        });

        // 保存游戏数据
        function saveGameData() {
            localStorage.setItem('lowIQGame', JSON.stringify({
                gold, streak, stats, coffeeCorrect, foodCorrect, titles
            }));
        }

        // 页面加载时恢复数据
        function loadGameData() {
            const saved = localStorage.getItem('lowIQGame');
            if (saved) {
                const data = JSON.parse(saved);
                gold = data.gold || 0;
                streak = data.streak || 0;
                stats = data.stats || { common: 0, rare: 0, epic: 0, legendary: 0 };
                coffeeCorrect = data.coffeeCorrect || 0;
                foodCorrect = data.foodCorrect || 0;
                titles = data.titles || { coffee: false, food: false };

                document.getElementById('goldCount').textContent = gold;
                document.getElementById('streakCount').textContent = streak;
                document.getElementById('statCommon').textContent = stats.common;
                document.getElementById('statRare').textContent = stats.rare;
                document.getElementById('statEpic').textContent = stats.epic;
                document.getElementById('statLegendary').textContent = stats.legendary;

                // 恢复称号状态
                updateTitleProgress('coffee');
                updateTitleProgress('food');
                if (titles.coffee) {
                    document.getElementById('coffeeBadge').classList.add('unlocked');
                }
                if (titles.food) {
                    document.getElementById('foodBadge').classList.add('unlocked');
                }
            }
        }

        // 初始化
        loadGameData();
    </script>
</body>
</html>
